version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/storage/queries
    gen:
      go:
        package: dbgen
        out: internal/storage/dbgen
        sql_package: pgx/v5
        sql_driver: github.com/jackc/pgx/v5
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        rename:
          tg_id: TgID
        overrides:
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - column: data_points.value
            go_type: float64
